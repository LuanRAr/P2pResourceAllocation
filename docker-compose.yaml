services:

  # ─── Brokers ─────────────────────────────────────────────

  broker-norte:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_norte
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - PORT=5000
      - MY_IP=broker-norte
      - RING_ADDRS=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  broker-sul:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_sul
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - PORT=5000
      - MY_IP=broker-sul
      - RING_ADDRS=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  broker-leste:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_leste
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Leste
      - PORT=5000
      - MY_IP=broker-leste
      - RING_ADDRS=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  broker-oeste:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_oeste
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Oeste
      - PORT=5000
      - MY_IP=broker-oeste
      - RING_ADDRS=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000


  # ─── Sensores ────────────────────────────────────────────

  sensor-norte-radar:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_norte_radar
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - SENSOR_TYPE=Radar
      - BROKER_LIST=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  sensor-sul-naval:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_sul_naval
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - SENSOR_TYPE=NavalSensor
      - BROKER_LIST=broker-sul:5000,broker-norte:5000,broker-leste:5000,broker-oeste:5000
    
  sensor-leste-radar:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_leste_radar
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Leste
      - SENSOR_TYPE=Radar
      - BROKER_LIST=broker-leste:5000,broker-norte:5000,broker-sul:5000,broker-oeste:5000
  
  sensor-oeste-naval:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_oeste_naval
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Oeste
      - SENSOR_TYPE=NavalSensor
      - BROKER_LIST=broker-oeste:5000,broker-norte:5000,broker-sul:5000,broker-leste:5000 

  # ─── Drones ──────────────────────────────────────────────

  drone-norte-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_01
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE-A
      - DRONE_PORT=6000
      - MY_IP=drone-norte-01
      # CORREÇÃO: Adicionar todos os brokers da infraestrutura compartilhada
      - BROKER_LIST=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  drone-norte-02:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_02
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE-B
      - DRONE_PORT=6001
      - MY_IP=drone-norte-02
      - BROKER_LIST=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000

  drone-sul-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_sul_01
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - DRONE_ID=DRONE-SUL-A
      - DRONE_PORT=6000
      - MY_IP=drone-sul-01
      - BROKER_LIST=broker-norte:5000,broker-sul:5000,broker-leste:5000,broker-oeste:5000