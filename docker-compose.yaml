services:

  broker-norte:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_norte
    environment:
      - SECTOR_NAME=Norte
      - PORT=5000
      - PEER_BROKERS=172.20.0.3:5000,172.20.0.4:5000
      - MY_IP=172.20.0.2
    networks:
      ormuz_net:
        ipv4_address: 172.20.0.2
    restart: unless-stopped

  broker-sul:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_sul
    environment:
      - SECTOR_NAME=Sul
      - PORT=5000
      - PEER_BROKERS=172.20.0.2:5000,172.20.0.4:5000
      - MY_IP=172.20.0.3
    networks:
      ormuz_net:
        ipv4_address: 172.20.0.3
    restart: unless-stopped

  broker-leste:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_leste
    environment:
      - SECTOR_NAME=Leste
      - PORT=5000
      - PEER_BROKERS=172.20.0.2:5000,172.20.0.3:5000
      - MY_IP=172.20.0.4
    networks:
      ormuz_net:
        ipv4_address: 172.20.0.4
    restart: unless-stopped

  #Sensores
  #BROKER_LIST: broker principal primeiro, fallbacks depois
  sensor-norte-radar:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_norte_radar
    depends_on: [broker-norte, broker-sul]
    environment:
      - SECTOR_NAME=Norte
      - SENSOR_TYPE=Radar
      - BROKER_LIST=172.20.0.2:5000,172.20.0.3:5000
    networks:
      - ormuz_net
    restart: unless-stopped

  sensor-sul-naval:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_sul_naval
    depends_on: [broker-sul, broker-norte]
    environment:
      - SECTOR_NAME=Sul
      - SENSOR_TYPE=NavalSensor
      - BROKER_LIST=172.20.0.3:5000,172.20.0.2:5000
    networks:
      - ormuz_net
    restart: unless-stopped

  #Drones
  #BROKER_LIST: broker principal primeiro, fallbacks a seguir.
  drone-norte-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_01
    depends_on: [broker-norte, broker-sul]
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE
      - BROKER_LIST=172.20.0.2:5000,172.20.0.3:5000,172.20.0.4:5000
    networks:
      - ormuz_net
    restart: unless-stopped

  drone-norte-02:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_02
    depends_on: [broker-norte, broker-sul]
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE
      - BROKER_LIST=172.20.0.2:5000,172.20.0.3:5000
    networks:
      - ormuz_net
    restart: unless-stopped

  drone-sul-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_sul_01
    depends_on: [broker-sul, broker-norte]
    environment:
      - SECTOR_NAME=Sul
      - DRONE_ID=DRONE-SUL
      - BROKER_LIST=172.20.0.3:5000,172.20.0.2:5000,172.20.0.4:5000
    networks:
      - ormuz_net
    restart: unless-stopped

networks:
  ormuz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24