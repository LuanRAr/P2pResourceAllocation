services:
  broker-norte:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_norte
    environment:
      - SECTOR_NAME=Norte
      - PORT=5000
      - PEER_BROKERS=192.168.1.11:5000  
      - MY_IP=192.168.1.10              
    ports:
      - "5000:5000"                   
    restart: unless-stopped

  sensor-norte-radar:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_norte_radar
    depends_on: [broker-norte]
    environment:
      - SECTOR_NAME=Norte
      - SENSOR_TYPE=Radar
      - BROKER_LIST=192.168.1.10:5000,192.168.1.11:5000 
    restart: unless-stopped

  drone-norte-01:
    build: { context: ., args: { TARGET: drone } }
    container_name: drone_norte_01
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-A1
      - BROKER_LIST=192.168.1.10:5000,192.168.1.11:5000
    restart: unless-stopped

  drone-norte-02:
    build: { context: ., args: { TARGET: drone } }
    container_name: drone_norte_02
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-A2
      - BROKER_LIST=192.168.1.10:5000,192.168.1.11:5000
    restart: unless-stopped