services:

  # ─── Brokers ────────────────────────────────────────────────────────────────

  broker-norte:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_norte
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - PORT=5000
      - MY_IP=172.16.201.9
      - RING_ADDRS=172.16.201.9:5000,172.16.201.10:5000

  broker-sul:
    build:
      context: .
      args:
        TARGET: broker
    container_name: broker_sul
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - PORT=5000
      - MY_IP=172.16.201.10
      - RING_ADDRS=172.16.201.9:5000,172.16.201.10:5000

  # ─── Sensores ───────────────────────────────────────────────────────────────

  sensor-norte-radar:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_norte_radar
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - SENSOR_TYPE=Radar
      - BROKER_LIST=172.16.201.9:5000,172.16.201.10:5000

  sensor-sul-naval:
    build:
      context: .
      args:
        TARGET: sensor
    container_name: sensor_sul_naval
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - SENSOR_TYPE=NavalSensor
      - BROKER_LIST=172.16.201.10:5000,172.16.201.9:5000

  # ─── Drones ─────────────────────────────────────────────────────────────────

  drone-norte-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_01
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE-A
      - DRONE_PORT=6000
      - MY_IP=172.16.201.9
      - BROKER_LIST=172.16.201.9:5000,172.16.201.10:5000

  drone-norte-02:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_norte_02
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Norte
      - DRONE_ID=DRONE-NORTE-B
      - DRONE_PORT=6001
      - MY_IP=172.16.201.9
      - BROKER_LIST=172.16.201.9:5000,172.16.201.10:5000

  drone-sul-01:
    build:
      context: .
      args:
        TARGET: drone
    container_name: drone_sul_01
    network_mode: host
    restart: unless-stopped
    environment:
      - SECTOR_NAME=Sul
      - DRONE_ID=DRONE-SUL-A
      - DRONE_PORT=6000
      - MY_IP=172.16.201.10
      - BROKER_LIST=172.16.201.10:5000,172.16.201.9:5000